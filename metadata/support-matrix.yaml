schema_version: 1
status_definitions:
  official-native: The target framework provides an official Material 3 implementation.
    Confirm that the API or behavior belongs to the Classic baseline.
  native-mapped: Reuse a native control and map it to M3 through theme or style resources.
  custom-md3: The target framework does not provide a complete M3 implementation;
    the repository supplies the visual and interaction layer.
  partial: The framework offers Material styling or partial support, but full baseline
    compliance is not assumed.
  experimental: The repository has an implementation or example that has not reached
    stable release quality.
  documented: The repository has an implementation strategy and mapping documentation;
    runtime verification is incomplete.
