name: sync-final-v020-en

on:
  push:
    branches:
      - main
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore final English repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/md3sync
          cat .sync/chunk-*.txt > /tmp/md3sync.b64
          base64 -d /tmp/md3sync.b64 > /tmp/md3sync.tar.gz
          tar -xzf /tmp/md3sync.tar.gz -C /tmp/md3sync
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            --exclude '.sync' \
            /tmp/md3sync/ ./
          rm -rf .sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: sync final English v0.2.0 repository'
          git push
