name: bootstrap-web-visual
on:
  push:
    paths:
      - '.github/workflows/bootstrap-web-visual.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/component-catalog/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run update:visual
      - name: Commit baselines
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test: add web visual baselines' || exit 0
          git push