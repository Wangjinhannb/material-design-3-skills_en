name: linux-ui
on:
  push:
    paths:
      - 'examples/component-catalog/linux-gtk/**'
      - 'examples/component-catalog/linux-qt/**'
      - 'examples/reference-app/linux-gtk/**'
      - 'examples/reference-app/linux-qt/**'
      - '.github/workflows/linux-ui.yml'
  pull_request:
    paths:
      - 'examples/component-catalog/linux-gtk/**'
      - 'examples/component-catalog/linux-qt/**'
      - 'examples/reference-app/linux-gtk/**'
      - 'examples/reference-app/linux-qt/**'
      - '.github/workflows/linux-ui.yml'
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb imagemagick
      - run: cmake -S examples/component-catalog/linux-gtk -B build/gtk-catalog && cmake --build build/gtk-catalog
      - run: xvfb-run -a ctest --test-dir build/gtk-catalog --output-on-failure
      - run: cmake -S examples/reference-app/linux-gtk -B build/gtk-reference && cmake --build build/gtk-reference
      - name: Capture catalog screenshot
        shell: bash
        run: |
          xvfb-run -a bash -c 'build/gtk-catalog/md3-gtk-catalog & pid=$!; sleep 2; import -window root gtk-catalog.png; kill $pid || true'
      - uses: actions/upload-artifact@v4
        with: { name: gtk-catalog-screenshot, path: gtk-catalog.png }
  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev xvfb imagemagick
      - run: cmake -S examples/component-catalog/linux-qt -B build/qt-catalog && cmake --build build/qt-catalog
      - run: xvfb-run -a build/qt-catalog/md3-qt-catalog --smoke
      - run: cmake -S examples/reference-app/linux-qt -B build/qt-reference && cmake --build build/qt-reference
      - name: Capture catalog screenshot
        shell: bash
        run: |
          xvfb-run -a bash -c 'build/qt-catalog/md3-qt-catalog & pid=$!; sleep 2; import -window root qt-catalog.png; kill $pid || true'
      - uses: actions/upload-artifact@v4
        with: { name: qt-catalog-screenshot, path: qt-catalog.png }