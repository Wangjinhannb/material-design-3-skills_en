name: ios
on:
  push:
    paths:
      - 'examples/component-catalog/ios/**'
      - 'examples/reference-app/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'examples/component-catalog/ios/**'
      - 'examples/reference-app/ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build reference app
        working-directory: examples/reference-app/ios
        run: |
          xcodegen generate
          xcodebuild -project MD3Reference.xcodeproj -scheme MD3Reference -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build catalog
        working-directory: examples/component-catalog/ios
        run: |
          xcodegen generate
          xcodebuild -project MD3Catalog.xcodeproj -scheme MD3Catalog -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: UI accessibility test
        working-directory: examples/component-catalog/ios
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for arr in d.values() for x in arr if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcodebuild test -project MD3Catalog.xcodeproj -scheme MD3Catalog -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcresult
          path: examples/component-catalog/ios/TestResults.xcresult
          if-no-files-found: ignore