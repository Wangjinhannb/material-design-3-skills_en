name: android
on:
  push:
    paths:
      - 'examples/component-catalog/android/**'
      - 'examples/reference-app/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'examples/component-catalog/android/**'
      - 'examples/reference-app/android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [examples/component-catalog/android, examples/reference-app/android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle -p ${{ matrix.project }} :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace