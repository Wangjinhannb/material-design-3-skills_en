name: temporary-doc-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-doc-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Rewrite documentation
        run: python .github/scripts/cleanup_docs.py
      - name: Regenerate generated docs
        run: |
          python tools/component_generator/generate_component_docs.py
          python tools/support_matrix/generate.py
      - name: Validate repository
        run: make check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/scripts/cleanup_docs.py .github/workflows/temporary-doc-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: tighten English product documentation"
          git push
