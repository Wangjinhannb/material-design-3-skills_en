name: MD3Catalog
options:
  bundleIdPrefix: org.example
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  MD3Catalog:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.MD3Catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MD3CatalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MD3Catalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.MD3CatalogUITests
        GENERATE_INFOPLIST_FILE: YES
